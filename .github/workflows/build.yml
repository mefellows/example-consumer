name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      setup_pact:
        description: 'Set up Pact testing in this project'
        required: false
        default: false
        type: boolean

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACTFLOW_TOKEN_FOR_CI_CD_WORKSHOP }}
  REACT_APP_API_BASE_URL: http://localhost:3001
  GIT_COMMIT: ${{ github.sha }}
  GIT_REF: ${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pact_provider: [
          'pactflow-example-provider'
        ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install
        run: npm i
      - name: Test
        env:
          PACT_PROVIDER: ${{ matrix.pact_provider }}
        run: npm t

  # 🚀 AI-Powered Pact Setup Job
  # Runs on manual trigger to set up comprehensive Pact testing
  pact-setup:
    runs-on: ubuntu-latest
    if: github.event.inputs.setup_pact == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      
      - name: Create MCP config for Claude CLI
        run: |
          mkdir -p ~/.config/claude
          cat > ~/.config/claude/mcp.json << 'EOF'
          {
            "mcpServers": {
              "smartbear": {
                "command": "npx",
                "type": "stdio",
                "args": ["-y", "@smartbear/mcp@latest"],
                "env": {
                  "PACT_BROKER_BASE_URL": "${{ env.PACT_BROKER_BASE_URL }}",
                  "PACT_BROKER_TOKEN": "${{ env.PACT_BROKER_TOKEN }}"
                }
              }
            }
          }
          EOF
      
      - name: Run Pact setup with AI
        env:
          # Note: ANTHROPIC_API_KEY secret must be configured in repository settings
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Starting AI-Powered Pact Setup ==="
          
          # Make script executable and run it
          chmod +x scripts/pact-setup.sh
          ./scripts/pact-setup.sh
          
          echo "=== Setup Complete ==="
          
          # Display results
          if [ -f "pact-setup-results.md" ]; then
            echo "📋 Setup Results:"
            cat pact-setup-results.md
          else
            echo "❌ Setup results file not found"
            exit 1
          fi
      
      - name: Configure Git
        run: |
          git config --global user.name "Pact Setup Bot"
          git config --global user.email "actions@github.com"
      
      - name: Create feature branch
        run: |
          BRANCH_NAME="feat/pact-setup-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b "$BRANCH_NAME"
      
      - name: Commit changes
        run: |
          # Add all changed files except setup files
          git add .
          
          # Remove setup files from staging (they'll be in artifacts instead)
          git reset HEAD pact-setup.md || echo "pact-setup.md not found"
          git reset HEAD pact-setup-results.md || echo "pact-setup-results.md not found"
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Create commit with detailed message
          git commit -m "🚀 Set up Pact testing infrastructure

          This commit adds basic Pact testing setup:
          - Pact testing dependencies and configuration
          - Test infrastructure (Jest, TypeScript config)
          - ONE basic happy path test to prove setup works
          - Scripts for running and publishing Pact tests
          - Foundation for future comprehensive testing
          
          Generated on: $(date)
          Commit: ${{ github.sha }}
          
          To run the basic test:
          npm run test:pact
          
          To publish contracts:
          npm run pact:publish
          
          Note: This is SETUP ONLY - use coverage analysis for comprehensive tests"
      
      - name: Push branch
        run: |
          git push origin "$BRANCH_NAME"
      
      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read setup results for PR description
            let setupResults = '';
            try {
              setupResults = fs.readFileSync('pact-setup-results.md', 'utf8');
            } catch (e) {
              setupResults = '⚠️ Could not read setup results';
            }
            
            const prBody = `## 🚀 Pact Testing Infrastructure Setup
            
            This PR sets up the basic Pact testing infrastructure for the project with a working foundation.
            
            ### 🎯 What This PR Does
            
            - ✅ Adds Pact testing dependencies to package.json
            - ✅ Sets up test infrastructure and configuration
            - ✅ Creates ONE basic happy path test to prove setup works
            - ✅ Configures Jest and TypeScript for Pact testing
            - ✅ Uses PactV4 specification
            - ✅ Provides foundation for future comprehensive testing
            
            ### 📋 Setup Results
            
            <details>
            <summary>📊 <strong>Detailed Setup Report</strong></summary>
            
            ${setupResults}
            
            </details>
            
            ### 🧪 How to Test
            
            \`\`\`bash
            # Install dependencies
            npm install
            
            # Run the basic Pact test
            npm run test:pact
            
            # Run all tests
            npm test
            
            # Publish contracts (requires broker configuration)
            npm run pact:publish
            \`\`\`
            
            ### 🔄 Next Steps
            
            1. **Merge this PR** to establish Pact infrastructure
            2. **Run the basic test** to verify setup works
            3. **Use separate coverage analysis** to identify missing tests
            4. **Add comprehensive tests** in follow-up PRs
            5. **Configure your Pact Broker** settings if needed
            
            ### 📝 Important Notes
            
            - This PR focuses on **SETUP ONLY** - not comprehensive test coverage
            - One basic happy path test is included to prove the infrastructure works
            - Use the existing Pact coverage analysis workflow for comprehensive testing
            - Future test additions can build on this foundation
            
            ---
            
            ✨ **Generated automatically by AI-powered setup**
            📅 Created: ${new Date().toISOString()}
            🎯 **Focus**: Infrastructure setup, not comprehensive testing`;
            
            // Get the default branch of the repository
            const repoInfo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const defaultBranch = repoInfo.data.default_branch;
            
            const result = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚀 Set up Pact testing infrastructure (setup only)',
              head: process.env.BRANCH_NAME,
              // base: defaultBranch, // <- this is what we want for other projects
              base: 'feat/ai-setup',  // For this demo, we want to show only the changes against this branch
              body: prBody
            });
            
            console.log(`Created PR #${result.data.number}: ${result.data.html_url}`);
            
            // Add labels
            try {
              await github.rest.issues.addLabels({
                issue_number: result.data.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['automated-setup', 'pact-testing', 'ai-generated']
              });
            } catch (labelError) {
              console.log('Could not add labels:', labelError.message);
            }
      
      - name: Upload Setup Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-setup-results-${{ github.run_id }}
          path: |
            pact-setup-results.md
            pact-setup.md
  