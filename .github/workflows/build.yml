name: Build

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      setup_pact:
        description: 'Set up Pact testing in this project'
        required: false
        default: false
        type: boolean

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACTFLOW_TOKEN_FOR_CI_CD_WORKSHOP }}
  REACT_APP_API_BASE_URL: http://localhost:3001
  GIT_COMMIT: ${{ github.sha }}
  GIT_REF: ${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pact_provider: [
          'pactflow-example-provider'
        ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install
        run: npm i
      - name: Test
        env:
          PACT_PROVIDER: ${{ matrix.pact_provider }}
        run: npm t

  # 🚀 AI-Powered Pact Setup Job
  # Runs on manual trigger to set up comprehensive Pact testing
  pact-setup:
    runs-on: ubuntu-latest
    if: github.event.inputs.setup_pact == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      
      - name: Create MCP config for Claude CLI
        run: |
          mkdir -p ~/.config/claude
          cat > ~/.config/claude/mcp.json << 'EOF'
          {
            "mcpServers": {
              "smartbear": {
                "command": "npx",
                "type": "stdio",
                "args": ["-y", "@smartbear/mcp@latest"],
                "env": {
                  "PACT_BROKER_BASE_URL": "${{ env.PACT_BROKER_BASE_URL }}",
                  "PACT_BROKER_TOKEN": "${{ env.PACT_BROKER_TOKEN }}"
                }
              }
            }
          }
          EOF
      
      - name: Run Pact setup with AI
        env:
          # Note: ANTHROPIC_API_KEY secret must be configured in repository settings
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Starting AI-Powered Pact Setup ==="
          
          # Make script executable and run it
          chmod +x scripts/pact-setup.sh
          ./scripts/pact-setup.sh
          
          echo "=== Setup Complete ==="
          
          # Display results
          if [ -f "pact-setup-results.md" ]; then
            echo "📋 Setup Results:"
            cat pact-setup-results.md
          else
            echo "❌ Setup results file not found"
            exit 1
          fi
      
      - name: Configure Git
        run: |
          git config --global user.name "Pact Setup Bot"
          git config --global user.email "actions@github.com"
      
      - name: Create feature branch
        run: |
          BRANCH_NAME="feat/pact-setup-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b "$BRANCH_NAME"
      
      - name: Commit changes
        run: |
          # Add all changed files
          git add .
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Create commit with detailed message
          git commit -m "🚀 Set up comprehensive Pact testing

          This commit adds:
          - Pact testing dependencies and configuration
          - Comprehensive test suite covering all API endpoints
          - Test scripts and infrastructure
          - Generated using SmartBear MCP AI tools
          
          Generated on: $(date)
          Commit: ${{ github.sha }}
          
          To run the tests:
          npm run test:pact
          
          To publish contracts:
          npm run pact:publish"
      
      - name: Push branch
        run: |
          git push origin "$BRANCH_NAME"
      
      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read setup results for PR description
            let setupResults = '';
            try {
              setupResults = fs.readFileSync('pact-setup-results.md', 'utf8');
            } catch (e) {
              setupResults = '⚠️ Could not read setup results';
            }
            
            const prBody = `## 🚀 Automated Pact Testing Setup
            
            This PR sets up comprehensive Pact testing for the project using AI-powered SmartBear MCP tools.
            
            ### 🎯 What This PR Does
            
            - ✅ Adds Pact testing dependencies to package.json
            - ✅ Creates comprehensive test suite covering all API endpoints
            - ✅ Sets up test infrastructure and configuration
            - ✅ Includes tests for multiple HTTP status codes (200, 400, 401, 404)
            - ✅ Follows TypeScript and Jest best practices
            - ✅ Uses PactV4 specification
            
            ### 📋 Setup Results
            
            <details>
            <summary>📊 <strong>Detailed Setup Report</strong></summary>
            
            ${setupResults}
            
            </details>
            
            ### 🧪 How to Test
            
            \`\`\`bash
            # Install dependencies
            npm install
            
            # Run Pact tests
            npm run test:pact
            
            # Run all tests
            npm test
            
            # Publish contracts (requires broker configuration)
            npm run pact:publish
            \`\`\`
            
            ### 🔄 Next Steps
            
            1. Review the generated test files
            2. Verify test coverage meets your requirements
            3. Update any test scenarios as needed
            4. Configure your Pact Broker settings
            5. Merge this PR to enable Pact testing
            
            ---
            
            ✨ **Generated automatically by SmartBear MCP AI tools**
            📅 Created: ${new Date().toISOString()}
            🤖 Powered by: [SmartBear MCP Server](https://developer.smartbear.com/smartbear-mcp/docs/mcp-server)`;
            
            const result = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚀 Set up comprehensive Pact testing with AI',
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: prBody
            });
            
            console.log(`Created PR #${result.data.number}: ${result.data.html_url}`);
            
            // Add labels
            try {
              await github.rest.issues.addLabels({
                issue_number: result.data.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['automated-setup', 'pact-testing', 'ai-generated']
              });
            } catch (labelError) {
              console.log('Could not add labels:', labelError.message);
            }
      
      - name: Upload Setup Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-setup-results-${{ github.run_id }}
          path: |
            pact-setup-results.md
            pact-setup.md
  